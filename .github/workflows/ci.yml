name: CI

# Windows only by design: the tool targets Windows and shells out to Windows CLIs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # No network and no model calls, so these run anywhere.
      - name: Tests
        run: cargo test

      - name: Release build
        run: cargo build --release

      # The committed binary is what consuming repositories vendor, so a stale or
      # missing one is a real defect rather than a packaging detail.
      - name: Committed binary is present and runnable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\cross-review.exe')) {
            throw 'dist\cross-review.exe is missing. Run .\build.ps1 and commit the result.'
          }
          $committed = (& '.\dist\cross-review.exe' --version).Trim()
          $built = (& '.\target\release\cross-review.exe' --version).Trim()
          Write-Host "committed: $committed"
          Write-Host "built:     $built"
          if ($committed -ne $built) {
            throw "dist\cross-review.exe reports '$committed' but the source builds '$built'. Run .\build.ps1 and commit the result."
          }

      # Guards the failure contract that the calling agent depends on: a missing
      # reviewer CLI must fail loudly rather than degrade into a same-model review.
      - name: Missing reviewer CLI fails loudly
        shell: pwsh
        run: |
          $lines = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"cross_model_review","arguments":{"instructions":"x"}}}'
          )
          $inFile = Join-Path $env:RUNNER_TEMP 'mcp-in.txt'
          [System.IO.File]::WriteAllLines($inFile, $lines, (New-Object System.Text.UTF8Encoding($false)))
          $out = @(Get-Content $inFile | & '.\target\release\cross-review.exe' --reviewer codex --bin 'C:\nope\codex.exe' 2>$null)
          if ($out.Count -lt 2) { throw "expected two responses, got $($out.Count)" }
          $call = $out[1] | ConvertFrom-Json
          if ($call.result.isError -ne $true) { throw 'expected isError=true' }
          $text = $call.result.content[0].text
          if ($text -notmatch 'CLI_NOT_FOUND') { throw "expected CLI_NOT_FOUND, got: $text" }
          if ($text -notmatch 'ACTION REQUIRED') { throw 'expected the stop-and-escalate instruction' }
          Write-Host 'failure contract holds'

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cross-review-exe
          path: target/release/cross-review.exe
