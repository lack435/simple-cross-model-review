name: CI

# Windows only by design: the tool targets Windows and shells out to Windows CLIs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # No network and no model calls, so these run anywhere.
      - name: Tests
        run: cargo test

      # Via build.ps1 so CI exercises the same build definition a release uses, including
      # the --remap-path-prefix flags and its check that no home directory leaked in.
      - name: Build and verify
        shell: pwsh
        env:
          CROSS_REVIEW_BUILD: ${{ github.sha }}
        run: .\build.ps1 -SkipChecks

      - name: Report what was built
        shell: pwsh
        run: '& ''.\dist\cross-review.exe'' --version'

      # Guards the failure contract that the calling agent depends on: a missing
      # reviewer CLI must fail loudly rather than degrade into a same-model review.
      - name: Missing reviewer CLI fails loudly
        shell: pwsh
        run: |
          $lines = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"cross_model_review","arguments":{"instructions":"x"}}}'
          )
          $inFile = Join-Path $env:RUNNER_TEMP 'mcp-in.txt'
          [System.IO.File]::WriteAllLines($inFile, $lines, (New-Object System.Text.UTF8Encoding($false)))
          $out = @(Get-Content $inFile | & '.\dist\cross-review.exe' --reviewer codex --bin 'C:\nope\codex.exe' 2>$null)
          if ($out.Count -lt 2) { throw "expected two responses, got $($out.Count)" }
          $call = $out[1] | ConvertFrom-Json
          if ($call.result.isError -ne $true) { throw 'expected isError=true' }
          $text = $call.result.content[0].text
          if ($text -notmatch 'CLI_NOT_FOUND') { throw "expected CLI_NOT_FOUND, got: $text" }
          if ($text -notmatch 'ACTION REQUIRED') { throw 'expected the stop-and-escalate instruction' }
          Write-Host 'failure contract holds'

      # Every run leaves a downloadable binary, so the executable is obtainable from any
      # commit without building locally -- which is what lets it stop being committed.
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cross-review-${{ github.sha }}
          path: dist/cross-review.exe
