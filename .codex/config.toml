# Project-level Codex configuration for cross-review's own repository.
#
# This is the reverse of .mcp.json: here Codex is the caller and Claude Opus 4.8 is the
# reviewer, so the tool can be dogfooded in both directions from one checkout.
#
# Both directions point at dist\cross-review.exe on purpose. An earlier version pointed
# here at target\release\ so the reverse test would always exercise a fresh build, which
# backfired: Windows locks a running executable, so an open Codex session held the build
# output and `cargo build --release` failed with "failed to remove file". Keeping both
# servers on dist\ leaves target\ free, so building is never blocked; the cost is that
# restaging dist\ requires unloading both agent sessions first, which build.ps1 detects and
# reports by PID rather than silently shipping a stale binary.
#
# Prerequisite: Codex only loads project config for trusted folders. Approve this folder
# when Codex first opens it, which writes
#   [projects.'c:\dev\simple-cross-model-review']
#   trust_level = "trusted"
# into %USERPROFILE%\.codex\config.toml. Until that exists this file is ignored silently,
# and `codex mcp list` will not show the server either way -- it reports only global
# config. Verify from inside a session with cross_model_review_status.
#
# Account profile: --claude-profile work pins the Claude reviewer to a dedicated per-user
# config home rather than whatever ~/.claude happens to be signed into, so a review is
# billed to the account authorized for this repo, not the desktop app's ambient login. If
# that home is re-logged to a different account mid-review, the switch guard fails the
# review closed rather than delivering it under the wrong account -- it cannot undo billing
# that already happened. "work" is only a label; it resolves to a private directory under
# %CROSS_REVIEW_HOME% / %LOCALAPPDATA%\cross-review, so this line is identical on every
# machine and commits no per-person state.
#
# Each machine sets the label up once, from a chat session in this checkout. To provision a
# new home -- or to switch which account it holds -- sign in through the vendor login:
#     cross_model_setup_profile { reviewer: "claude", profile: "work", login: true }
# If the home already exists and is signed in, authorize it without a login (login: true is
# only for deliberate provisioning or an account switch, since it re-runs the vendor OAuth):
#     cross_model_setup_profile { reviewer: "claude", profile: "work" }
# Until a machine authorizes the label, a review from here fails closed with
# PROFILE_NOT_AUTHORIZED rather than silently falling back to the ambient account. The
# forward direction (.mcp.json) pins the Codex reviewer to its own "work" profile the same way.

[mcp_servers.cross_review]
command = "dist\\cross-review.exe"
args = [
    "--reviewer", "claude", "--model", "claude-opus-4-8", "--effort", "medium",
    # Review levels (a caller-selectable model+effort preset; see README "Review levels").
    # standard == the base --effort, so an omitted `level` is unchanged from before.
    "--level", "fast:claude-opus-4-8:low",
    "--level", "standard:claude-opus-4-8:medium",
    "--level", "thorough:claude-opus-4-8:high",
    "--default-level", "standard",
    "--claude-profile", "work",
]

# There is no --diff here: git reviews are no longer pre-captured. The Claude reviewer derives
# the change live through the read-only evidence service's repository_diff tool -- it diffs the
# working tree against the branch's fork point (merge-base with refs/remotes/origin/{HEAD,main,
# master}), including committed and uncommitted work and untracked files. So the old commit-first /
# clean-`git status` / fetch-and-fast-forward-`main` ritual is gone: committed and uncommitted work
# are both in the canonical diff, and the base is a remote-tracking ref no local branch can shadow.
#
# A `git fetch` before the review is still worth it, and only that: branch-base resolves
# refs/remotes/origin/* from what is on disk and never fetches, so a stale (unfetched) tracking ref
# would put the fork point behind where the branch diverged. Nothing else in the old ritual applies.
# (--claude-profile is required for a git review: an ambient Claude has no evidence path and is
# refused before it runs.)

# A single cross_model_review_result call now blocks until the review is done, so this budget
# must exceed the server's collect cap (CAPTURE_BUDGET + --timeout-seconds + finalization grace;
# ~1890s at the defaults). 2400s leaves margin. Below the cap is no longer destructive: abandoning
# a collect only detaches the wait -- the reviewer keeps running and the result stays collectible
# by review_id -- so a client timeout shorter than the review degrades to polling rather than
# discarding a review that was still coming. cross_model_review_cancel is the tool that stops a
# reviewer.
startup_timeout_sec = 30
tool_timeout_sec = 2400
