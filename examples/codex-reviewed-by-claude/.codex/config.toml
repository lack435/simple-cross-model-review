# Project-level Codex configuration: register cross-review as an MCP server so Codex
# can send work to Claude Opus 4.8 for an independent review.
#
# Commit this at <your-project>\.codex\config.toml, alongside tools\cross-review.exe.
# Relative paths resolve against the project root, so this entry travels with the repo
# and a fresh clone needs no per-machine setup.
#
# Prerequisite: the folder must be trusted. Codex records that in your global config as
#   [projects.'c:\path\to\your-project']
#   trust_level = "trusted"
# which it writes when you approve the folder on first open. An untrusted folder's
# project config is not loaded.

[mcp_servers.cross_review]
command = "tools/cross-review.exe"
# A reviewer's model and effort come only from --level (--model/--effort were removed); at
# least one is required. Declare more and add --default-level to offer the caller a menu.
args = ["--reviewer", "claude", "--level", "standard:claude-opus-4-8:medium"]

# The Claude reviewer has no shell, so it reads the repository through the read-only evidence
# service and derives the change live via its repository_diff tool: the working tree against the
# branch's fork point (merge-base with the remote-tracking HEAD/main/master), covering committed
# and uncommitted work and untracked files. There is no --diff flag -- capture modes were retired,
# and passing --diff is now a hard error. A `git fetch` before reviewing is still worth it (the
# fork point resolves from on-disk remote-tracking refs and never fetches); nothing else of the old
# commit-first / fetch-and-fast-forward ritual applies. --claude-profile is required: an ambient
# Claude has no evidence path and is refused.

# A single cross_model_review_result call now blocks until the review is done, so this budget
# must exceed the server's collect cap (CAPTURE_BUDGET + --timeout-seconds + finalization grace;
# ~1890s at the defaults). 2400s leaves margin. Below the cap is no longer destructive: abandoning
# a collect only detaches the wait -- the reviewer keeps running and the result stays collectible
# by review_id -- so a client timeout shorter than the review degrades to polling rather than
# discarding a review that was still coming. cross_model_review_cancel is the tool that stops a
# reviewer.
startup_timeout_sec = 30
tool_timeout_sec = 2400
