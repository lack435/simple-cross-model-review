[package]
name = "cross-review"
version = "0.13.0"
edition = "2021"
rust-version = "1.79"
description = "MCP server that sends work to a different model for an independent review"
license = "MIT"
publish = false

# Which GitHub release channel a tag cut from this commit publishes to. It lives here
# rather than being inferred from the tag name so that a plain semver tag can still be
# published as a prerelease, and it sits next to `version` so the two are bumped in one
# edit. The release workflow refuses to publish when it is missing or unrecognised: a
# prerelease that reached the Releases page as "Latest" by omission would be handed to
# every project that vendors this binary, so the default is an error rather than a guess.
#   "prerelease" -> published, but not marked Latest
#   "stable"     -> published as Latest
[package.metadata.release]
channel = "stable"

[[bin]]
name = "cross-review"
path = "src/main.rs"

[features]
# Off by default and compiled out of every shipped binary. When enabled, the first response of each
# turn has its machine block removed before evaluation, so the block-repair path can be exercised
# against a *real* reviewer CLI once (`smoke.ps1 -ProveBlockRepair`) rather than shipping on the
# strength of unit tests alone. It is a feature rather than an environment variable deliberately:
# an ambient variable is inherited state, and a released binary that can be told to degrade real
# reviews and spend real tokens is a backdoor no warning makes safe. `build.ps1`, `dist\` and the
# release workflow never enable it. See docs/unstructured-turn-recovery.md.
repair-test-hook = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
