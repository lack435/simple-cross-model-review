[package]
name = "cross-review"
version = "0.5.0"
edition = "2021"
rust-version = "1.77"
description = "MCP server that sends work to a different model for an independent review"
license = "MIT"
publish = false

[[bin]]
name = "cross-review"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
